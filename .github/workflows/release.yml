name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Import Developer ID Application certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build, sign, and notarize release
        id: build
        env:
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/release.sh ${{ steps.version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/micspresso-${{ steps.version.outputs.version }}-macos.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output SHA256
        run: |
          echo "### Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Archive:** micspresso-${{ steps.version.outputs.version }}-macos.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          shasum -a 256 dist/micspresso-${{ steps.version.outputs.version }}-macos.tar.gz >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}  # Skip for pre-releases

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check Homebrew token
        id: homebrew-token
        env:
          HOMEBREW_CASK_TOKEN: ${{ secrets.HOMEBREW_CASK_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_CASK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Homebrew cask update because HOMEBREW_CASK_TOKEN is not configured."
          fi

      - name: Get SHA256 from release
        id: sha256
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_NAME="micspresso-${{ steps.version.outputs.version }}-macos.tar.gz"
          SHA256=$(gh api repos/moltenbits/micspresso/releases/tags/v${{ steps.version.outputs.version }} \
            --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest" \
            | sed 's/sha256://')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        if: steps.homebrew-token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: moltenbits/homebrew-tap
          token: ${{ secrets.HOMEBREW_CASK_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/micspresso.rb << 'EOF'
          cask "micspresso" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.sha256.outputs.sha256 }}"

            url "https://github.com/moltenbits/micspresso/releases/download/v#{version}/micspresso-#{version}-macos.tar.gz"
            name "Micspresso"
            desc "Menu bar app that keeps Bluetooth mics warm so dictation starts instantly"
            homepage "https://github.com/moltenbits/micspresso"

            depends_on macos: :ventura

            app "Micspresso.app"
            binary "#{appdir}/Micspresso.app/Contents/MacOS/micspresso"

            # Quit the running instance before brew replaces the bundle on
            # upgrade/uninstall, then relaunch (-g: without stealing focus).
            uninstall quit: "com.moltenbits.micspresso"

            postflight do
              system_command "/usr/bin/open",
                             args: ["-g", "-a", "#{appdir}/Micspresso.app"]
            end

            zap trash: [
              "~/Library/Preferences/com.moltenbits.micspresso.plist",
            ]

            caveats <<~EOS
              Micspresso needs microphone permission to hold the mic open —
              allow it when prompted. The orange mic indicator staying lit is
              expected: the mic is open (that's the point) but nothing is
              recorded.

              While a Bluetooth mic is kept warm, macOS keeps the headset in
              its call-audio mode, which reduces playback quality. Pause
              Micspresso from the menu bar when you want full-quality audio.
            EOS
          end
          EOF

          echo "Updated Casks/micspresso.rb:"
          cat homebrew-tap/Casks/micspresso.rb

      - name: Commit and push
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/micspresso.rb
          git commit -m "micspresso ${{ steps.version.outputs.version }}"
          git push
