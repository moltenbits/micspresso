name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --disable-sandbox

      - name: Run tests
        run: swift test --disable-sandbox

      # Release bundling catches plist/signing/layout regressions. Audio HAL
      # behavior can't be exercised on GitHub-hosted runners (no real input
      # devices or TCC grants), so the smoke tests stay on CLI paths.
      - name: Release bundle + CLI smoke test
        run: |
          chmod +x scripts/*.sh
          ./scripts/bundle.sh release
          test -x .build/release/Micspresso.app/Contents/MacOS/micspresso
          test -f .build/release/Micspresso.app/Contents/Info.plist
          test -f .build/release/Micspresso.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict .build/release/Micspresso.app
          .build/release/Micspresso.app/Contents/MacOS/micspresso --version
          .build/release/Micspresso.app/Contents/MacOS/micspresso --help

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: swift-format lint
        run: xcrun swift-format lint -r Sources/ Tests/
